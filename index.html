<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    
    <div id="principal-container">
        <div id="tareas-contenedor">
            <header>
                <h1>TO DO LIST</h1>
            </header>
            <div id="tareas">
                <ul id="lista-tareas">
                    
               
                  
                </ul>
            </div>
            <div id="agregar">
                <button id="btn-agregar">+</button>
            </div>
        </div>
        <div id="sidebar">
            <div id="contador" class="sidebar-objetos">
                <H5 id="total-titulo">Tareas pendientes:</H5> 
                <h3 id="total-tareas"></h3>
                
            </div>
            <div id="todas-tareas"  class="sidebar-objetos">
                <span class="texto">TAREAS</span>
               
            </div>
            <div id="pendientes"  class="sidebar-objetos">
                  <span class="texto">PENDIENTES</span>
                
            </div>
            <div id="completadas" class="sidebar-objetos">
                  <span class="texto">REALIZADAS</span>
            </div>
            <div id="limpiar-completadas" class="sidebar-objetos">
         <span class="texto">LIMPIAR COMPLETADAS</span>
        </div>
        </div>
        


    </div>
    <div class="modal fade"  id="MODAL-insert" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Agregar tarea nueva</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input id="input-tarea" placeholder="agrega tu tarea aqui">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button id="agregar-modal" type="button" class="btn btn-primary">Guardar</button>
      </div>
    </div>
  </div>
</div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"> </script>
</body>

</html>
